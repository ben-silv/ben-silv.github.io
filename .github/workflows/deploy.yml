name: Deploy to GitHub Pages

# Regenerates the pages from src/content.json, checks the result, then
# publishes the repository root. No node, no bundler — Python 3 is already on
# the runner, and the site is static HTML plus one small script.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render pages from content.json
        run: python tools/render.py

      - name: Check the output
        run: python tools/check.py

      # content/ is Ben's own writing — rough notes, questions to himself, the
      # editable copy deck — and tools/ is the build. Neither belongs on the
      # portfolio's own domain. They stay in the repository; they just are not
      # served. This runs after check.py, which expects them to be there.
      - name: Keep the workshop out of the shop window
        run: rm -rf content tools

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
